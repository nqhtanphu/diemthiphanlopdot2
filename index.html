<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra cứu điểm thi NQH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: nền trắng, một cột giữa trang, banner xanh #0055aa ở đầu, bảng điểm dạng phiếu. Cột IRT dùng màu cam để tách khỏi tông xanh. */
:root {
  --bg: #f3f7fc;
  --surface: #ffffff;
  --ink: #12263f;
  --muted: #5a6c85;
  --line: #d9e3f0;
  --brand: #0055aa;
  --brand-ink: #ffffff;
  --brand-soft: #e6f0fb;
  --irt-bg: #fff1dc;
  --irt-ink: #8a4300;
  --irt-line: #f0c47f;
  --err-bg: #fdeceb;
  --err-ink: #8a2418;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1626; --surface: #13233a; --ink: #e8f0fb; --muted: #9bb0cc; --line: #26405f;
    --brand: #3b8fe0; --brand-ink: #ffffff; --brand-soft: #1a3354;
    --irt-bg: #3b2a10; --irt-ink: #ffd699; --irt-line: #8a6420;
    --err-bg: #3a1c19; --err-ink: #ffb4a8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1626; --surface: #13233a; --ink: #e8f0fb; --muted: #9bb0cc; --line: #26405f;
  --brand: #3b8fe0; --brand-ink: #ffffff; --brand-soft: #1a3354;
  --irt-bg: #3b2a10; --irt-ink: #ffd699; --irt-line: #8a6420;
  --err-bg: #3a1c19; --err-ink: #ffb4a8; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; margin: 0; }
.band { background: var(--brand); color: var(--brand-ink); padding-block: 18px 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 660px; margin: 0 auto; }
.band .inner { display: flex; flex-direction: column; gap: 8px; text-align: center; align-items: center; }
.logo { display: block; width: 84px; height: auto; margin-bottom: 14px; }
.org { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.9; order: 2; }
h1 { margin: 0; font-size: clamp(21px, 5.6vw, 32px); line-height: 1.25; font-weight: 800; letter-spacing: 0.01em; order: 1; }
main { padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main .inner { display: flex; flex-direction: column; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; margin-top: -40px; box-shadow: 0 6px 20px rgba(0,60,130,0.10); }
h2 { margin: 0 0 16px; font-size: 18px; font-weight: 700; color: var(--brand); }
form { display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.lbl { font-size: 13px; font-weight: 600; padding: 0; }
input[type="text"] { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; width: 100%; }
input[type="text"]::placeholder { color: var(--muted); }
input:focus-visible, button:focus-visible, .day input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
.days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.day { position: relative; }
.day input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.day span { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 8px 6px; text-align: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-weight: 600; font-size: 14px; line-height: 1.25; }
.day input:checked + span { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.go { font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 8px; padding: 13px 18px; }
.go:hover { filter: brightness(1.1); }
#out { display: flex; flex-direction: column; gap: 14px; }
.msg { border-radius: 10px; padding: 14px 16px; font-size: 14.5px; }
.msg.err { background: var(--err-bg); color: var(--err-ink); }
.msg.hint { border: 1px dashed var(--line); color: var(--muted); }
.slip { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.slip-head { padding: 16px 20px; background: var(--brand-soft); display: flex; flex-direction: column; gap: 2px; }
.slip-head .tag { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.slip-head .name { font-size: 21px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; color: var(--brand); }
.slip-head .day-t { font-size: 14px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 12px 20px; border-bottom: 1px solid var(--line); font-size: 15px; }
th { font-weight: 500; }
td { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 17px; white-space: nowrap; }
tr.sum th, tr.sum td { background: var(--brand-soft); }
tr.sum th { font-weight: 600; }
tr.irt th, tr.irt td { background: var(--irt-bg); color: var(--irt-ink); border-bottom-color: var(--irt-line); }
tr.irt th { font-weight: 700; }
tr.irt td { font-size: 20px; }
tr.res th, tr.res td { background: var(--brand); color: var(--brand-ink); border-bottom: 0; }
tr.res th { font-weight: 700; }
tr.res td { font-size: 18px; white-space: normal; }
@media (prefers-reduced-motion: no-preference) { .slip { animation: rise .25s ease-out; } @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } } }
</style>

function norm(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "d").toLowerCase().replace(/\s+/g, " ").trim();
}
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function fmt(n) { return (n === null || n === undefined || n === "") ? "–" : Number(n).toLocaleString("vi-VN", { maximumFractionDigits: 2 }); }

var box = document.getElementById("days");
DAYS.forEach(function (d, i) {
  var w = el("label", "day");
  var inp = document.createElement("input");
  inp.type = "radio"; inp.name = "day"; inp.value = d; inp.id = "day" + i;
  if (i === 0) inp.checked = true;
  w.appendChild(inp); w.appendChild(el("span", "", d));
  box.appendChild(w);
});

var out = document.getElementById("out");
function row(cls, label, val) {
  var tr = el("tr", cls);
  tr.appendChild(el("th", "", label));
  tr.appendChild(el("td", "", val));
  return tr;
}
function slip(st) {
  var s = el("article", "slip");
  var h = el("div", "slip-head");
  h.appendChild(el("span", "tag", "Phiếu điểm"));
  h.appendChild(el("div", "name", st.n));
  h.appendChild(el("div", "day-t", "Ngày thi: " + st.d));
  s.appendChild(h);
  var wrap = el("div"); wrap.style.overflowX = "auto";
  var t = document.createElement("table");
  var tb = document.createElement("tbody");
  SUBJECTS.forEach(function (k, i) { tb.appendChild(row("", k, fmt(st.s[i]))); });
  tb.appendChild(row("sum", "Tổng điểm (thang 10đ/câu)", fmt(st.t)));
  tb.appendChild(row("irt", "Tổng điểm (thang IRT)", fmt(st.i)));
  tb.appendChild(row("res", "Kết quả phân lớp", st.p || "–"));
  t.appendChild(tb); wrap.appendChild(t); s.appendChild(wrap);
  return s;
}
function run() {
  var raw = document.getElementById("name").value, key = norm(raw);
  var day = (document.querySelector('input[name="day"]:checked') || {}).value;
  out.textContent = "";
  if (!key) { out.appendChild(el("div", "msg err", "Bạn chưa nhập họ tên. Hãy nhập đầy đủ họ và tên rồi bấm Tra cứu.")); document.getElementById("name").focus(); return; }
  var found = DATA.filter(function (s) { return norm(s.n) === key && s.d === day; });
  if (!found.length) { out.appendChild(el("div", "msg err", "Không tìm thấy \"" + raw.trim() + "\" trong buổi thi " + day + ". Hãy kiểm tra lại họ tên hoặc chọn buổi thi khác.")); return; }
  if (found.length > 1) out.appendChild(el("div", "msg hint", "Có " + found.length + " bài thi trùng họ tên trong buổi này."));
  found.forEach(function (st) { out.appendChild(slip(st)); });
}
document.getElementById("f").addEventListener("submit", function (e) { e.preventDefault(); run(); });
